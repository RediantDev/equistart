services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: equistart
      POSTGRES_USER: equistart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-equistart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equistart -d equistart"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://equistart:${POSTGRES_PASSWORD:-equistart}@db:5432/equistart
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
