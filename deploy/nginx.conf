# частые попытки входа режет и само приложение; здесь — грубая защита от наплыва
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# nginx перед приложением. Замените equistart.example на свой домен.
# Сертификат: deploy/certs/fullchain.pem и privkey.pem (например, certbot с webroot deploy/acme).

server {
    listen 80;
    server_name equistart.example;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name equistart.example;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # положения турниров (PDF) и документы лошадей — до 10 МБ
    client_max_body_size 12m;

    location ~ ^/(login|register|verify-phone)/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
