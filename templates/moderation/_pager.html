{% if page.paginator.num_pages > 1 %}
<nav class="mpager" aria-label="Страницы">
  {% if page.has_previous %}<a class="btn btn--sm" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.previous_page_number }}">← Назад</a>{% endif %}
  <span class="table__sub">Страница {{ page.number }} из {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn--sm" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.next_page_number }}">Дальше →</a>{% endif %}
</nav>
{% endif %}
