{% extends "base.html" %}
{% block title %}Смена пароля — СтартЛист{% endblock %}
{% block content %}
<section class="auth">
  <div class="card auth__card">
    <a class="back" href="{% url 'accounts:profile' %}">← Профиль</a>
    <h1 class="h1">Смена пароля</h1>
    <form method="post" novalidate class="form">{% csrf_token %}
      {% for error in form.non_field_errors %}<div class="alert alert--error" role="alert">{{ error }}</div>{% endfor %}
      {% for field in form %}{% include "partials/field.html" %}{% endfor %}
      <button class="btn btn--primary btn--block">Сохранить</button>
    </form>
  </div>
</section>
{% endblock %}
