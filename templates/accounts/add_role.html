{% extends "base.html" %}
{% block title %}Добавить роль — СтартЛист{% endblock %}
{% block content %}
<section class="auth">
  <div class="card auth__card">
    <a href="{% url 'accounts:profile' %}" class="back">← Профиль</a>
    <h1 class="h1">Добавить роли</h1>
    <p class="muted">Роли добавятся в этот же аккаунт, профиль сохранится.</p>
    <form method="post" novalidate class="form">
      {% csrf_token %}
      <div class="field{% if form.category.errors %} field--error{% endif %}">{% include "partials/role_choices.html" with field=form.category %}</div>
      <button type="submit" class="btn btn--primary btn--block btn--lg">Добавить</button>
    </form>
  </div>
</section>
{% endblock %}
