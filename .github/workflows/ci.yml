name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: equistart
          POSTGRES_USER: equistart
          POSTGRES_PASSWORD: equistart
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U equistart"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://equistart:equistart@127.0.0.1:5432/equistart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: tokens.css соответствует design/tokens.json
        run: python design/build_tokens.py && git diff --exit-code static/css/tokens.css
      - name: Проверка конфигурации
        run: python manage.py check
      - name: Нет незаписанных миграций
        run: python manage.py makemigrations --check --dry-run
      - name: Тесты
        run: |
          set -o pipefail
          python manage.py test --verbosity 2 2>&1 | tee test.log
      - name: Ошибки тестов — в аннотации (видны через API без логов)
        if: failure()
        run: |
          python - <<'PY'
          import re
          try:
              s = open("test.log", encoding="utf8").read()
          except FileNotFoundError:
              raise SystemExit
          blocks = re.split(r"\n={50,}\n", s)
          n = 0
          for b in blocks:
              if b.startswith(("ERROR:", "FAIL:")) and n < 10:
                  msg = b[-3000:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title=test::{msg}")
                  n += 1
          if not n:
              tail = s[-3000:].replace("%", "%25").replace("\n", "%0A")
              print(f"::error title=tail::{tail}")
          PY
      - name: Проверка production-настроек
        env:
          DJANGO_ENV: production
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-long-random-value-for-deploy-check-0123456789
          APP_ORIGIN: https://equistart.example
          DJANGO_ALLOWED_HOSTS: equistart.example
          SECURE_HSTS_SECONDS: "31536000"
        run: python manage.py check --deploy --fail-level WARNING
